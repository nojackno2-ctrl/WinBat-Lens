name: CI

on:
  push:
    branches: [main, "agent/**", "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WinBatLens.sln

      - name: Build Release
        run: dotnet build WinBatLens.sln -c Release --no-restore --nologo -warnaserror

      - name: Run tests
        run: dotnet test tests/WinBatLens.Tests/WinBatLens.Tests.csproj -c Release --no-restore --nologo --logger "trx;LogFileName=test-results.trx"

      - name: Publish single-file smoke artifact
        run: dotnet publish WinBatLens.csproj -c Release --no-restore --nologo -p:PublishReadyToRun=false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
